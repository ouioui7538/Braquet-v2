# netlify.toml
# Indique à Netlify que le dossier à publier est la racine du repo
# (puisque le contenu de /pwa sera à la racine du dépôt GitHub)

[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
